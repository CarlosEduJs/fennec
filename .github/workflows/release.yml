name: Release Crates & Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Pipeline (PR or Publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check for pending changesets in .changes/
        id: check_changes
        run: |
          CHANGES_COUNT=$(find .changes -maxdepth 1 -name "*.md" ! -name "README.md" ! -name ".*" 2>/dev/null | wc -l)
          echo "count=$CHANGES_COUNT" >> $GITHUB_OUTPUT
          echo "Found $CHANGES_COUNT pending change file(s)."

      - name: Create or Update Release PR
        if: steps.check_changes.outputs.count > 0
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Create and switch to dedicated release branch
          git checkout -B chore/release-packages
          
          # Generate PR report while .changes/ files exist AND apply version bumps
          cargo run -p xtask -- release-pr
          
          # Commit and push release branch with version updates and changelogs
          if [[ -n $(git status --porcelain) ]]; then
            git add Cargo.toml Cargo.lock crates/ apps/ .changes/
            git commit -m "chore(release): version packages"
            git push origin chore/release-packages --force
          fi
          
          # Ensure GitHub Pull Request exists and body is set from .changes_pr_body.md
          PR_TITLE="📦 chore(release): version packages"
          PR_BODY_FILE=".changes_pr_body.md"
          
          if [ -f "$PR_BODY_FILE" ]; then
            PR_NUM=$(gh pr list --base main --head chore/release-packages --json number -q '.[0].number')
            if [ -n "$PR_NUM" ]; then
              echo "🔄 Updating existing Release PR #$PR_NUM..."
              gh pr edit "$PR_NUM" --title "$PR_TITLE" --body-file "$PR_BODY_FILE"
            else
              echo "🆕 Creating new Release PR..."
              gh pr create --title "$PR_TITLE" --body-file "$PR_BODY_FILE" --base main --head chore/release-packages
            fi
            rm -f "$PR_BODY_FILE"
          fi

      - name: Publish to Crates.io, Tag & Create GitHub Releases
        if: steps.check_changes.outputs.count == 0
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$CARGO_REGISTRY_TOKEN" ]; then
            cargo run --locked -p xtask -- publish --execute
          else
            echo "⚠️ CARGO_REGISTRY_TOKEN não configurado. Executando simulação de publicação e release..."
            cargo run --locked -p xtask -- publish --dry-run
          fi
