[package]
description = "Parser and codegen for the fncc native UI framework — compiles .fui files to GPUI Rust code"
edition = "2024"
homepage = "https://github.com/carlosedujs/fncc"
license = "Apache-2.0"
name = "fncc-core"
repository = "https://github.com/carlosedujs/fncc"
version = "0.6.0"

[dependencies]
anyhow = "1"
fncc-styles = { path = "../fncc-styles", version = "0.0.0" }
pest = "2"
pest_derive = "2"
quote = "1"
serde = { version = "1", features = ["derive"] }
syn = { version = "2", default-features = false, features = [
    "full",
    "parsing",
    "printing",
] }
toml = "0.8"
